workflows:
  android-build:
    name: Build RobotAI APK
    max_build_duration: 60

    environment:
      groups:
        - android

    scripts:
      - name: Install Buildozer
        script: |
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Build APK
        script: |
          yes | buildozer android debug

    artifacts:
      - bin/*.apk
