workflows:
  android-build:
    name: Build RobotAI APK
    max_build_duration: 60

    environment:
      groups:
        - android

    scripts:
      - name: Install Buildozer
        script: |
          python3 -m pip install "pip<25"
          python3 -m pip install setuptools
          python3 -m pip install git+https://github.com/kivy/buildozer.git
          python3 -m pip install cython==0.29.36

      - name: Build APK
        script: |
          yes | buildozer android debug

    artifacts:
      - bin/*.apk
