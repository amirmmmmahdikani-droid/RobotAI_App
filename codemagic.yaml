workflows:
  android-build:
    name: Build RobotAI APK
    max_build_duration: 60

    environment:
      groups:
        - android

    scripts:
  - name: Install Buildozer
    script: |
      python3 -m pip install "pip<25"
      python3 -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        script: |
          yes | buildozer android debug

    artifacts:
      - bin/*.apk
